services:

  ##
  # Service to copy built code from the PHP image into the shared volume.
  # This runs once before the main application services start.
  ##
  init-copy:
    build:
      context: .
      args:
        LOCAL_PHP: ${LOCAL_PHP-latest}
    # Overwrite the command to copy all built files to the shared volume mount point
    command: sh -c "cp -R /var/www/* /mnt/webroot"
    volumes:
      - webroot:/mnt/webroot
    # Ensure the copy happens before the web server or php-fpm starts
    depends_on:
      mysql:
        condition: service_healthy

  ##
  # The web server container.
  # NOTE: Host volume mount removed, using shared 'webroot' volume.
  ##
  wordpress-develop:
    image: nginx:alpine

    networks:
      - wpdevnet

    ports:
      - ${LOCAL_PORT-8889}:80

    environment:
      LOCAL_DIR: ${LOCAL_DIR-src}

    volumes:
      - ./tools/local-env/default.template:/etc/nginx/conf.d/default.template
      - webroot:/var/www

    # Load our config file, substituting environment variables into the config.
    command: /bin/sh -c "envsubst '$$LOCAL_DIR' < /etc/nginx/conf.d/default.template > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"

    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
      init-copy:
        condition: service_completed_successfully

  ##
  # The PHP container.
  # NOTE: Using 'build' and shared 'webroot' volume.
  ##
  php:
    # 'image' is optional here since 'build' is used, but kept for clarity/fallback.
    image: wordpressdevelop/php:${LOCAL_PHP-latest}
    build:
      context: . # Look for the Dockerfile in the current directory
      args:
        # Pass the environment variable LOCAL_PHP to the Dockerfile as a build argument.
        LOCAL_PHP: ${LOCAL_PHP-latest}

    networks:
      - wpdevnet

    environment:
      LOCAL_PHP_XDEBUG: ${LOCAL_PHP_XDEBUG-false}
      XDEBUG_MODE: ${LOCAL_PHP_XDEBUG_MODE-develop,debug}
      LOCAL_PHP_MEMCACHED: ${LOCAL_PHP_MEMCACHED-false}
      PHP_FPM_UID: ${PHP_FPM_UID-1000}
      PHP_FPM_GID: ${PHP_FPM_GID-1000}
      GITHUB_REF: ${GITHUB_REF-false}
      GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME-false}
      HOST_PATH: /var/www/src

    volumes:
      - ./tools/local-env/php-config.ini:/usr/local/etc/php/conf.d/php-config.ini
      - webroot:/var/www # Mounts the shared volume

    # Copy or delete the Memcached dropin plugin file as appropriate.
    command: /bin/sh -c "if [ $LOCAL_PHP_MEMCACHED = true ]; then cp -n /var/www/tests/phpunit/includes/object-cache.php /var/www/src/wp-content/object-cache.php; else rm -f /var/www/src/wp-content/object-cache.php; fi && exec php-fpm"

    # The init directive ensures the command runs with a PID > 1, so Ctrl+C works correctly.
    init: true

    extra_hosts:
      - localhost:host-gateway

  ##
  # The MySQL container.
  ##
  mysql:
    image: ${LOCAL_DB_TYPE-mysql}:${LOCAL_DB_VERSION-latest}

    networks:
      - wpdevnet

    ports:
      - "${LOCAL_DB_PORTS-3306}"

    environment:
      MYSQL_ROOT_PASSWORD: password

    volumes:
      - ./tools/local-env/mysql-init.sql:/docker-entrypoint-initdb.d/mysql-init.sql
      - mysql:/var/lib/mysql

    # For compatibility with PHP versions that don't support the caching_sha2_password auth plugin used in MySQL 8.0.
    command: ${LOCAL_DB_AUTH_OPTION-}

    healthcheck:
      test: [
        'CMD-SHELL',
        'if [ "$LOCAL_DB_TYPE" = "mariadb" ]; then case "$LOCAL_DB_VERSION" in 5.5|10.0|10.1|10.2|10.3) mysqladmin ping -h localhost || exit $$?;; *) mariadb-admin ping -h localhost || exit $$?;; esac; else mysqladmin ping -h localhost || exit $$?; fi'
      ]
      timeout: 5s
      interval: 5s
      retries: 10

  ##
  # The WP CLI container.
  # NOTE: Host volume mount removed. Since it's not starting up automatically, 
  # it will not be able to find code in a bare CI/CD environment unless you
  # manually execute a script using the 'webroot' volume.
  ##
  cli:
    image: wordpressdevelop/cli:${LOCAL_PHP-latest}

    networks:
      - wpdevnet

    environment:
      LOCAL_PHP_XDEBUG: ${LOCAL_PHP_XDEBUG-false}
      LOCAL_PHP_MEMCACHED: ${LOCAL_PHP_MEMCACHED-false}
      PHP_FPM_UID: ${PHP_FPM_UID-1000}
      PHP_FPM_GID: ${PHP_FPM_GID-1000}
      HOST_PATH: ${PWD-}/${LOCAL_DIR-src}
      WP_CONFIG_PATH: /var/www/wp-config.php

    volumes:
      # If you need to run CLI commands, you must mount the shared volume here:
      - webroot:/var/www

    # Keeps the service alive.
    command: 'sleep infinity'

    # The init directive ensures the command runs with a PID > 1, so Ctrl+C works correctly.
    init: true

    extra_hosts:
      - localhost:host-gateway

    depends_on:
      php:
        condition: service_started
      mysql:
        condition: service_healthy
      init-copy:
        condition: service_completed_successfully

  ##
  # The Memcached container.
  ##
  memcached:
    image: memcached

    networks:
      - wpdevnet

    ports:
      - 11211:11211

    depends_on:
      php:
        condition: service_started

volumes:
  # So that sites aren't wiped every time containers are restarted, MySQL uses a persistent volume.
  mysql: {}
  # Shared volume for application code between PHP and Nginx containers
  webroot: {}

networks:
  # Creating our own network allows us to connect between containers using their service name.
  wpdevnet:
    driver: bridge
